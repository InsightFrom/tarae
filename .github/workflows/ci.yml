name: CI

on:
  push:
    branches: [main, oss]
  pull_request:
    branches: [main, oss]

jobs:
  watcher:
    name: Watcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use stable Rust
        run: rustup default stable
      - name: Check formatting
        working-directory: packages/watcher
        run: cargo fmt --check
      - name: Clippy
        working-directory: packages/watcher
        run: cargo clippy -- -D warnings
      - name: Test
        working-directory: packages/watcher
        run: cargo test

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci
      - name: Syntax check
        run: |
          node --check packages/cli/bin/index.js
          for file in packages/cli/lib/*.js; do node --check "$file"; done

  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check packages/vscode-extension/src/extension.js

  install-script:
    name: Installer Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/install.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content scripts/install.ps1 -Raw), [ref]$null)

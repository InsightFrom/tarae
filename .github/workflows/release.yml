name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Tarae $GITHUB_REF_NAME"

  build-topa:
    name: Build topa
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: topa-linux-x64
            binary: target/release/topa
          - os: ubuntu-24.04-arm
            asset: topa-linux-arm64
            binary: target/release/topa
          - os: macos-15-intel
            asset: topa-darwin-x64
            binary: target/release/topa
          - os: macos-latest
            asset: topa-darwin-arm64
            binary: target/release/topa
          - os: windows-latest
            asset: topa-windows-x64.exe
            binary: target/release/topa.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use stable Rust
        run: rustup default stable
      - name: Build
        working-directory: packages/watcher
        run: cargo build --release
      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          cp "packages/watcher/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - name: Generate checksum
        shell: bash
        run: |
          node -e "const fs = require('fs'); const crypto = require('crypto'); const path = require('path'); const file = process.argv[1]; const digest = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'); fs.writeFileSync(file + '.sha256', digest + '  ' + path.basename(file) + '\n');" "dist/${{ matrix.asset }}"
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ matrix.asset }}
      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "dist/${{ matrix.asset }}" "dist/${{ matrix.asset }}.sha256" --clobber

[package]
name = "tarae-watcher"
version = "0.1.2"
edition = "2021"
description = "Topa (톺아) — Tarae's non-invasive local observer & MCP server"
license = "MIT"

[[bin]]
name = "topa"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# MCP SDK
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
schemars = "1"

# File watching
notify = "7"
notify-debouncer-mini = "0.5"

# Git integration
git2 = "0.19"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
regex = "1"
anyhow = "1"
dirs = "6"
async-trait = "0.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
